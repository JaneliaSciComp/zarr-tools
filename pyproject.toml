[build-system]
requires = ["setuptools>=70", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "zarr-tools"
version = "0.3.3"
description = "Command line tools for combininig ZARR arrays and generating the multiscale pyramid"
license = "BSD-3-Clause"
requires-python = ">=3.12"
dependencies = [
    "dask==2026.6.0",
    "distributed==2026.6.0",
    "numpy>2,<3",
    "ome-zarr-models==1.7",
    "pydantic>=2.11.5,<2.13",
    "pyyaml",
    "tornado",
    "toolz==1.1.0",
    "xarray-multiscale==2.1.0",
    "zarr>3,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
