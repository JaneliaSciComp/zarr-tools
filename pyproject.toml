[build-system]
requires = ["setuptools>=70", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "zarr-tools"
version = "0.3.3"
description = "Command line tools for combininig ZARR arrays and generating the multiscale pyramid"
license = "BSD-3-Clause"
requires-python = ">=3.12"
dependencies = [
    "dask==2026.6.0",
    "distributed==2026.6.0",
    "flatten_json",
    "numpy>2,<3",
    "ome-zarr-models==1.7",
    "pydantic>=2.11.5,<2.13",
    "pyyaml",
    "tornado",
    "toolz==1.1.0",
    "xarray-multiscale==2.1.0",
    "zarr>3,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[tool.pixi.dependencies]
python = "3.12.*"
pip = "*"

[tool.pixi.pypi-dependencies]
zarr-tools = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = "*"

[tool.pixi.feature.test.tasks]
test = "pytest tests"

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
